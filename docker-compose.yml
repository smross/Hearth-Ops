version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hearth-ops-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/hearth.db
      - SECRET_KEY=${SECRET_KEY}
      - APP_ENV=${APP_ENV:-production}
    networks:
      - hearth_net



volumes:
  data_storage:

networks:
  hearth_net:
    driver: bridge
