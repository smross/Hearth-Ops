services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hearth-ops-${APP_ENV:-production}-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/hearth.db
      - SECRET_KEY=${SECRET_KEY}
      - APP_ENV=${APP_ENV:-production}
      - TZ=${TZ:-America/Chicago}
    networks:
      - hearth_net

networks:
  hearth_net:
    driver: bridge

