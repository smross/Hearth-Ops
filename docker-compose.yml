services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hearth-ops-${APP_ENV:-production}-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - DATABASE_URL=sqlite:////app/data/hearth.db
      - SECRET_KEY=${SECRET_KEY}
      - APP_ENV=${APP_ENV:-production}
      - TZ=${TZ:-America/Chicago}
    networks:
      - hearth_net

networks:
  hearth_net:
    driver: bridge

